[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yfinance-sp500-analysis"
version = "0.1.0"
description = "An automated Python utility designed to track the daily closing prices of all S&P 500 constituent stocks and synchronize this data with a Google Sheet."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    "yfinance>=1.2.1",
    "pandas>=3.0.2",
    "numpy>=2.4.4",
    "gspread>=6.2.1",
    "google-auth>=2.49.2",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.0.3",
    "python-dotenv>=1.2.2",
]

[tool.setuptools]
py-modules = ["main", "sp500tracker"]
